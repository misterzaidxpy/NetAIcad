<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>netAIcad</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1f2328;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header .logo {
      font-size: 20px;
      line-height: 1;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #57606a;
      margin-bottom: 5px;
    }
    .input-row {
      display: flex;
      gap: 6px;
    }
    .input-row input {
      flex: 1;
      min-width: 0;
      padding: 7px 9px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .input-row input:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.15);
    }
    .test-btn {
      flex-shrink: 0;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      color: #1f2328;
      cursor: pointer;
    }
    .test-btn:hover:not(:disabled) {
      background: #eef1f4;
    }
    .test-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .field-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      min-height: 14px;
    }
    .field-footer a {
      font-size: 11px;
      color: #0066cc;
      text-decoration: none;
    }
    .field-footer a:hover {
      text-decoration: underline;
    }
    .test-status {
      font-size: 11px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .test-status.show {
      opacity: 1;
    }
    .test-status.ok {
      color: #1a7f37;
    }
    .test-status.fail {
      color: #cf222e;
    }
    .save-btn {
      width: 100%;
      padding: 9px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 2px;
    }
    .save-btn:hover {
      background: #0052a3;
    }
    .status {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.success {
      display: block;
      background-color: #d4edda;
      color: #155724;
    }
    .status.error {
      display: block;
      background-color: #f8d7da;
      color: #721c24;
    }
    .footer {
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
      color: #8b949e;
    }
    .footer a {
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🤖</span>
    <h1>netAIcad</h1>
  </div>

  <div class="field">
    <label for="openAiApiKey">OpenAI API Key</label>
    <div class="input-row">
      <input type="password" id="openAiApiKey" placeholder="sk-...">
      <button type="button" class="test-btn" id="testOpenAi">Test</button>
    </div>
    <div class="field-footer">
      <a href="https://platform.openai.com/api-keys" target="_blank">Get key</a>
      <span class="test-status" id="openAiStatus"></span>
    </div>
  </div>

  <div class="field">
    <label for="geminiApiKey">Gemini API Key</label>
    <div class="input-row">
      <input type="password" id="geminiApiKey" placeholder="AIza...">
      <button type="button" class="test-btn" id="testGemini">Test</button>
    </div>
    <div class="field-footer">
      <a href="https://makersuite.google.com/app/apikey" target="_blank">Get key</a>
      <span class="test-status" id="geminiStatus"></span>
    </div>
  </div>

  <div class="info" style="margin-bottom: 10px;">
    🌐 <strong>Web AI</strong> (no API key needed): the quiz page's "Web AI" button opens a real ChatGPT/Gemini tab for you. Make sure you're logged in there.
  </div>

  <button id="saveBtn" class="save-btn">Save Settings</button>
  <div class="status" id="status"></div>

  <div class="footer">by <a href="https://zaid.sh" target="_blank">Muhammad Zaid</a></div>

  <script src="popup.js"></script>
</body>
</html>
